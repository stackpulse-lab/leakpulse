name: Publish to PyPI

# Trusted Publishing (OIDC): no API token or password is stored in this repository.
# One-time setup: PyPI → Account → Publishing → add a "pending publisher" with
#   project: leakpulse
#   owner: stackpulse-lab
#   repository: leakpulse
#   workflow: publish.yml
#   environment: pypi
# After the first successful upload the pending publisher becomes a normal publisher.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python run_tests.py

  build:
    name: build sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          init = pathlib.Path("src/leakpulse/__init__.py").read_text(encoding="utf-8")
          version = re.search(r'__version__\s*=\s*"([^"]+)"', init).group(1)
          tag = os.environ["TAG"].lstrip("v")
          if tag != version:
              sys.exit(f"tag {os.environ['TAG']} does not match package version {version}")
          print(f"tag and version agree: {version}")
          PY
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: leakpulse version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: upload to PyPI (OIDC)
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/leakpulse
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
