[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakpulse"
dynamic = ["version"]
description = "Zero-dependency secret scanner for worktrees, staged changes and git history"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "StackPulse Lab", email = "360556499+stackpulse-lab@users.noreply.github.com" }]
keywords = ["security", "secrets", "secret-scanning", "devsecops", "git", "pre-commit", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
leakpulse = "leakpulse.cli:main"

[project.urls]
Homepage = "https://github.com/stackpulse-lab/leakpulse"
Issues = "https://github.com/stackpulse-lab/leakpulse/issues"
Changelog = "https://github.com/stackpulse-lab/leakpulse/blob/main/CHANGELOG.md"
Source = "https://github.com/stackpulse-lab/leakpulse"

[tool.setuptools.dynamic]
version = { attr = "leakpulse.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
